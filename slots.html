<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sketch</title>

  <link rel="stylesheet" href="style.css">

  <script src="libraries/p5.js"></script>
  <script src="libraries/p5.sound.min.js"></script>
  <script src="libraries/p5.collide2d.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.party@latest/dist/p5.party.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>

<body>

  <div class="topnav">
    <a href="index.html">
      <img src="Assets/logo.png" alt="Ultimate Gambling 360 logo" class="logo">

    </a>
      <a href="#" class="account-btn" id="accountBtn">Instructions</a>
    
    <h1 id="moneyDisplay">Money: </h1>

  </div>
  
  
  <div class="popup" id="popup">
  <div class="popup-content">
    <button id="closePopup">Close</button>

    <p>
    • Choose an open seat to join the table.<br>
      • Pull the lever down to place a bet<br>
      • Use scroll wheel to change your bet <br>
      • Three triangles is a jackpot(100x bet)<br>
      • Three circles is a big win(25x bet)<br>
      • Three squares is a normal win(2x bet)<br>
    </p>
  </div>
</div>

  <script>
    const popup = document.getElementById("popup");
    const closeBtn = document.getElementById("closePopup");
    const accountBtn = document.getElementById("accountBtn");


    accountBtn.onclick = function() {
      popup.style.display = "flex";
    };


    closeBtn.onclick = function() {
      popup.style.display = "none";
    };



    if (localStorage.getItem("money") === null) {
    localStorage.setItem("money", 5000);
  }

  function updateMoneyDisplay() {
    let money = parseInt(localStorage.getItem("money")) || 0;
    document.getElementById("moneyDisplay").textContent = "Money: $" + money;
  }

  updateMoneyDisplay();
  </script>
  
  <script src="slots/sketch.js"></script>


  
</body>
</html>
